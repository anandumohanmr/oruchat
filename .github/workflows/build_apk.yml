
name: Build OruChat Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Generate Android folder
        working-directory: oruchat
        run: |
          flutter create --org in.oruchat --project-name oru_chat --platforms=android /tmp/oru_gen
          cp -r /tmp/oru_gen/android ./android

      - name: Configure Android
        working-directory: oruchat
        run: dart run tool/patch_android.dart

      - name: Install dependencies
        working-directory: oruchat
        run: flutter pub get

      - name: Generate app icon
        working-directory: oruchat
        run: dart run flutter_launcher_icons

      - name: Build release APK
        working-directory: oruchat
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OruChat-Android-APK
          path: oruchat/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
