name: oru_chat
description: OruChat - free chat, calls, groups and stories.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.9.0
  flutter_webrtc: ^0.12.0
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  record: ^5.1.2
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  shared_preferences: ^2.3.3
  crypto: ^3.0.5
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/icon_legacy.png"
  adaptive_icon_background: "#5B05E2"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo_icon.png
    - assets/brand/wordmark.png
    - assets/brand/upi_qr.jpg
